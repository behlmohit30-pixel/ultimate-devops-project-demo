apiVersion: apps/v1
kind: Deployment
metadata:
  name: study-app
  labels:
    app.kubernetes.io/name: study-app
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: study-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: study-app
    spec:
      containers:
        - name: study-app
          image: study-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: study-app-secrets
                  key: anthropic-api-key
            - name: NODE_ENV
              value: "production"
            - name: PROXY_PORT
              value: "3001"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
